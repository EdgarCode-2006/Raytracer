# How every entity type looks, read by the client. The gameplay values (speeds, waves, sizes)
# are in gameplay.cfg, on the server's side. Every type of common/include/common/EntityType.hpp
# needs a model here.
#
# Each model is a list of parts, each an .obj with its own material. A part with an emission
# glows with its color and isn't lit. Ships fly along +x (the nose points right).
# The models in assets/game/models/ are placeholders made by tools/generate_placeholder_assets.py:
# replace the files, or point "obj" to other ones.
#
# spin: degrees per second, around spinAxis ("z" turns in the plane of the screen)
# maxBank: degrees of roll when moving up or down, reached at a vertical speed of bankAtSpeed
# contrastColor: the flat color of the model in high contrast mode (its glowing parts are white).
#     The player is cool and the enemies warm: blue against orange and yellow stays apart for the
#     most common color vision deficiencies.

player:
{
    scale = 1.3;
    maxBank = 25.0;
    contrastColor = { r = 0; g = 200; b = 255; };
    bankAtSpeed = 9.0;
    parts = (
        { obj = "assets/game/models/player_hull.obj"; color = { r = 175; g = 190; b = 210; }; },
        { obj = "assets/game/models/player_engine.obj"; color = { r = 255; g = 140; b = 40; }; emission = 1.0; }
    );
};

drone:
{
    scale = 0.9;
    spin = 120.0;
    contrastColor = { r = 255; g = 120; b = 0; };
    spinAxis = "z";
    parts = (
        { obj = "assets/game/models/drone_body.obj"; color = { r = 150; g = 60; b = 60; }; },
        { obj = "assets/game/models/drone_core.obj"; color = { r = 255; g = 40; b = 40; }; emission = 1.0; }
    );
};

saucer:
{
    scale = 1.1;
    spin = 60.0;
    contrastColor = { r = 255; g = 220; b = 0; };
    spinAxis = "y";
    parts = (
        { obj = "assets/game/models/saucer_body.obj"; color = { r = 110; g = 160; b = 120; }; },
        { obj = "assets/game/models/saucer_dome.obj"; color = { r = 80; g = 255; b = 140; }; emission = 1.0; }
    );
};
