# How every entity type looks, read by the client. The gameplay values (speeds, waves, sizes)
# are in gameplay.cfg, on the server's side. Every type of common/include/common/EntityType.hpp
# needs a model here.
#
# Each model is a list of parts, each an .obj with its own material. A part with an emission
# glows with its color and isn't lit. The player flies along +x (the nose points right), the
# enemies come from the right and face -x.
# The .obj files of assets/game/models/ are made in Blender by the scripts of tools/models/
# (tools/models/export_models.py writes them again): change a model there, not in its .obj.
#
# spin: degrees per second, around spinAxis ("z" turns in the plane of the screen)
# maxBank: degrees of roll when moving up or down, reached at a vertical speed of bankAtSpeed
# contrastColor: the flat color of the model in high contrast mode (its glowing parts are white).
#     The players are cool and the enemies warm: they stay apart for the most common color
#     vision deficiencies.
# themes: other looks of the same meshes, picked by the entity's variant (a player's slot: the
#     first player gets the first theme). A theme recolors the parts it names (a part's "name")
#     and has its own contrastColor. Without themes, a model has the colors of its parts.

# The 4 teams are told apart by hue and by lightness, so that they stay apart for color blind
# players too. Their parts are the same as the first theme's.
player:
{
    scale = 1.3;
    maxBank = 25.0;
    contrastColor = { r = 0; g = 215; b = 255; };
    bankAtSpeed = 9.0;
    parts = (
        { name = "hull";   obj = "assets/game/models/player_hull.obj";   color = { r = 212; g = 226; b = 245; }; },
        { name = "trim";   obj = "assets/game/models/player_trim.obj";   color = { r = 30;  g = 115; b = 240; }; },
        { name = "canopy"; obj = "assets/game/models/player_canopy.obj"; color = { r = 180; g = 228; b = 255; }; emission = 1.0; },
        { name = "engine"; obj = "assets/game/models/player_engine.obj"; color = { r = 100; g = 180; b = 255; }; emission = 1.0; }
    );
    themes = (
        { name = "Azure"; contrastColor = { r = 0; g = 215; b = 255; };
          colors = { hull   = { r = 212; g = 226; b = 245; }; trim   = { r = 30;  g = 115; b = 240; };
                     canopy = { r = 180; g = 228; b = 255; }; engine = { r = 100; g = 180; b = 255; }; }; },
        { name = "Aqua"; contrastColor = { r = 30; g = 220; b = 150; };
          colors = { hull   = { r = 185; g = 200; b = 206; }; trim   = { r = 135; g = 255; b = 240; };
                     canopy = { r = 205; g = 255; b = 245; }; engine = { r = 40;  g = 255; b = 200; }; }; },
        { name = "Rose"; contrastColor = { r = 250; g = 10; b = 155; };
          colors = { hull   = { r = 245; g = 225; b = 238; }; trim   = { r = 215; g = 30;  b = 140; };
                     canopy = { r = 255; g = 180; b = 225; }; engine = { r = 255; g = 10;  b = 155; }; }; },
        { name = "Lilac"; contrastColor = { r = 125; g = 120; b = 255; };
          colors = { hull   = { r = 242; g = 242; b = 250; }; trim   = { r = 200; g = 175; b = 255; };
                     canopy = { r = 220; g = 200; b = 255; }; engine = { r = 140; g = 95;  b = 255; }; }; }
    );
};

drone:
{
    scale = 0.9;
    spin = 120.0;
    contrastColor = { r = 255; g = 145; b = 15; };
    spinAxis = "z";
    parts = (
        { obj = "assets/game/models/drone_body.obj"; color = { r = 180; g = 85; b = 45; }; },
        { obj = "assets/game/models/drone_claws.obj"; color = { r = 220; g = 190; b = 145; }; },
        { obj = "assets/game/models/drone_eye.obj"; color = { r = 255; g = 200; b = 30; }; emission = 1.0; },
        { obj = "assets/game/models/drone_iris.obj"; color = { r = 150; g = 30; b = 35; }; }
    );
};

saucer:
{
    scale = 1.1;
    spin = 60.0;
    contrastColor = { r = 255; g = 240; b = 20; };
    spinAxis = "y";
    parts = (
        { obj = "assets/game/models/saucer_carapace.obj"; color = { r = 190; g = 140; b = 60; }; },
        { obj = "assets/game/models/saucer_band.obj"; color = { r = 150; g = 65; b = 60; }; },
        { obj = "assets/game/models/saucer_ports.obj"; color = { r = 255; g = 125; b = 20; }; emission = 1.0; },
        { obj = "assets/game/models/saucer_eye.obj"; color = { r = 255; g = 200; b = 30; }; emission = 1.0; }
    );
};

# Faces left, weaves fast and rolls into its turns.
fighter:
{
    scale = 1.1;
    maxBank = 30.0;
    bankAtSpeed = 3.5;
    contrastColor = { r = 255; g = 25; b = 35; };
    parts = (
        { obj = "assets/game/models/fighter_body.obj"; color = { r = 150; g = 65; b = 60; }; },
        { obj = "assets/game/models/fighter_carapace.obj"; color = { r = 220; g = 190; b = 145; }; },
        { obj = "assets/game/models/fighter_glow.obj"; color = { r = 255; g = 45; b = 40; }; emission = 1.0; }
    );
};

# Faces left, about 8 world units high: meant to stay on the right of the screen. A dark
# contrastColor keeps its white core and eyes readable in high contrast mode.
boss:
{
    scale = 4.0;
    contrastColor = { r = 215; g = 100; b = 60; };
    parts = (
        { obj = "assets/game/models/boss_body.obj"; color = { r = 200; g = 112; b = 95; }; },
        { obj = "assets/game/models/boss_armor.obj"; color = { r = 180; g = 85; b = 45; }; },
        { obj = "assets/game/models/boss_bone.obj"; color = { r = 220; g = 190; b = 145; }; },
        { obj = "assets/game/models/boss_core.obj"; color = { r = 255; g = 200; b = 30; }; emission = 1.0; },
        { obj = "assets/game/models/boss_eyes.obj"; color = { r = 255; g = 45; b = 40; }; emission = 1.0; }
    );
};
