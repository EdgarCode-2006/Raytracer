# The gameplay values, read by the server (for now the local server inside the client).
# How the entities look is in models.cfg. Types: see common/include/common/EntityType.hpp.
# Distances are in world units, the play area is 24 x 13.5 (common/include/common/World.hpp).

spawnInterval = 1.2;  # seconds between two enemies

player:
{
    speed = 9.0;      # world units per second
    size = 1.3;       # half of the ship's length: how close to the edges it can go
};

# speed: to the left, world units per second
# amplitude, frequency: vertical wave (world units, radians per second)
# size: half of the enemy's extent
enemies = (
    { type = "drone";  speed = 5.0; amplitude = 1.5; frequency = 2.5; size = 0.9; },
    { type = "saucer"; speed = 3.0; amplitude = 0.4; frequency = 1.5; size = 1.1; }
);
