# What the game spawns. Every model is a list of parts, each an .obj with its own material.
# The models in assets/game/models/ are placeholders made by tools/generate_placeholder_assets.py:
# replace the files, or point "obj" to other ones. Ships fly along +x (the nose points right).
# A part with an emission glows with its color and isn't lit.

playDepth = 12.0;     # distance from the camera to the plane the game is played on
spawnInterval = 1.2;  # seconds between two enemies

player:
{
    speed = 9.0;      # world units per second
    maxBank = 25.0;   # degrees of roll when moving up or down
    scale = 1.3;
    parts = (
        { obj = "assets/game/models/player_hull.obj"; color = { r = 175; g = 190; b = 210; }; },
        { obj = "assets/game/models/player_engine.obj"; color = { r = 255; g = 140; b = 40; }; emission = 1.0; }
    );
};

# speed: to the left, world units per second
# amplitude, frequency: vertical wave (world units, radians per second)
# spin: degrees per second, around spinAxis ("z" turns in the plane of the screen)
enemies = (
    {
        name = "drone";
        speed = 5.0;
        amplitude = 1.5;
        frequency = 2.5;
        spin = 120.0;
        spinAxis = "z";
        scale = 0.9;
        parts = (
            { obj = "assets/game/models/drone_body.obj"; color = { r = 150; g = 60; b = 60; }; },
            { obj = "assets/game/models/drone_core.obj"; color = { r = 255; g = 40; b = 40; }; emission = 1.0; }
        );
    },
    {
        name = "saucer";
        speed = 3.0;
        amplitude = 0.4;
        frequency = 1.5;
        spin = 60.0;
        spinAxis = "y";
        scale = 1.1;
        parts = (
            { obj = "assets/game/models/saucer_body.obj"; color = { r = 110; g = 160; b = 120; }; },
            { obj = "assets/game/models/saucer_dome.obj"; color = { r = 80; g = 255; b = 140; }; emission = 1.0; }
        );
    }
);
