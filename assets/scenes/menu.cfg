# Main menu background: only the HDRI, seen by a camera that never moves.
hdri = "assets/HDRIs/HDRI.exr";

camera:
{
    position = { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 60.0;
    yaw = 0.0;
    pitch = 0.0;
};

lights:
{
    ambient = 0.2;
};

features = (
    { name = "NormalMap"; active = false; },
    { name = "Outline"; active = false; },
    { name = "WireFrame"; active = false; },
    { name = "TraverseDepth"; active = false; }
);
