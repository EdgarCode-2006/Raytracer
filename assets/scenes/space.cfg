# The scene of the menu and the game: a scrolling space background seen by a camera that never
# moves. The ships are added by the client from what the server sends, see assets/game/models.cfg.

# Seen in the reflections, where the background doesn't cover.
hdri = "assets/HDRIs/HDRI.exr";

# Layers added on top of each other, each scrolling left at its speed (view heights per second).
# viewHeight is how much one texture height covers: 2 * tan(fieldOfView / 2) fills the screen.
background:
{
    viewHeight = 1.1547;
    layers = (
        { texture = "assets/game/textures/space_nebula.png"; speed = 0.02; },
        { texture = "assets/game/textures/space_stars_far.png"; speed = 0.06; },
        { texture = "assets/game/textures/space_stars_near.png"; speed = 0.18; }
    );
};

# The client places the camera itself, to see exactly the play area: only the fov is used.
camera:
{
    fieldOfView = 60.0;
};

lights:
{
    ambient = 0.25;
    # from the top left, behind the camera
    directional = (
        { direction = { x = 0.5; y = -0.6; z = 1.0; }; intensity = 0.85; }
    );
};

# Path tracing and ambient occlusion only give noise at one sample per pixel, which is what a
# frame that changes every time gets.
features = (
    { name = "PathTracing"; active = false; },
    { name = "AmbientOcclusion"; active = false; },
    { name = "NormalMap"; active = false; },
    { name = "Outline"; active = false; },
    { name = "WireFrame"; active = false; },
    { name = "TraverseDepth"; active = false; }
);
